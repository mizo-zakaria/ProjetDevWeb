<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Connexion - Cinema Camera</title>
    
    <!-- Fixed Font Awesome link -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Pirata+One&family=Tagesschrift&display=swap" rel="stylesheet">
    
    <style>
     *{
    margin: 0;
    padding:0;
    box-sizing: border-box;
    font-family: "Tagesschrift", system-ui;
}
.myform h1{
   font-family: "Pirata One", system-ui;
   color: #ffdb12;
  font-weight: 400;
  font-style: normal;
  font-size: 58px;
  text-align:center;

}

body{
    display: flex;
    justify-content: center;
    align-items:center;
    min-height: 100vh;
    background:url('../background/side.jpg') right no-repeat;
  background-size: cover;
  background-attachment: fixed;
  background-position:center;
  height: 100vh;
  width: 100%;
}
.myform{
  width:480px;
  background:transparent;
  border:2px solid #ffdb123f;
  backdrop-filter: blur(15px);
  box-shadow:0 0 10px rgba(0,0,0,.2);
  border-radius: 12px;
  padding: 30px 40px;
  visibility: visible;
}
.myform .inbox{
    
    width:100%;
    height:50px;
     position:relative;
    margin:30px 0;
}
.inbox input{
    width: 100%;
    height:100%;
    background: transparent;
    border: none;
    outline: none;
    border: 2px solid #ffdb123f;
    border-radius: 40px;
    font-size: 16px;
    color:#fff;
    padding:20px 45px 20px 20px;
}
.inbox input::placeholder{
    color:#ffffffc3;

}
.inbox i{
    position:absolute;
    color: #ffdb12;
    right:20px;
     top:50%;
     transform: translateY(-50%);
     font-size:20px;

}
.myform .btn{
    width:100%;
    height:45px;
    background:#ffdb12;
    border:none;
    outline:none;
    border-radius:40px;
    box-shadow:0 0 10px rgba(0,0,0,.1);
    cursor:pointer;
    font-size: 20px;
    font-weight: 600;
    color: #61160B;
  
}
.myform .btn:hover{
  color:white;
  background:#ffdb123c;
}

.inscription p{
    font-size:14,5px;
    text-align:center;
    color: #fff;
    margin: 20px 0 15px;
} 
.inscription p a{
    font-size:16px;
    color:#ffdb12;
    text-decoration: none;
    font-weight:900;
}
.inscription p a:hover {
   text-decoration: underline;

}
#mylogo{
    position: absolute;
    width:160px;
    bottom:90%;
    left:1%;
    cursor:pointer;
    overflow:hidden;
    border-radius: 3px;
    transition: transform 0.5s ease;
    transform-origin: center center;
} 
#mylogo:hover{
       transform: scale(1.1); 
}
   .password-toggle {
            position: absolute;
            right: 50px;
            top: 50%;
            transform: translateY(-50%);
            color: #ffdb12;
            cursor: pointer;
            font-size: 18px;
        }
#home i{
color: #ffdb12;
font-size: 30px;
  font-weight: 700;
  position: absolute;
  left: 96%;
  bottom:92%;
  line-height: 60px;
     cursor: pointer;
  opacity: 1;
  transition: transform 0.3s ease-in-out; 
}
#home i:hover{
    transform: scale(1.3); 
}
        .inscription {
            text-align: center;
            margin-top: 25px;
            padding-top: 20px;
            border-top: 1px solid rgba(255, 219, 18, 0.2);
        }
        
        .inscription p {
            font-size: 16px;
            color: rgba(255, 255, 255, 0.8);
            margin-bottom: 10px;
        }
        
        .inscription p a {
            font-size: 16px;
            color: #ffdb12;
            text-decoration: none;
            font-weight: bold;
            transition: all 0.3s ease;
        }
        
        .inscription p a:hover {
            text-decoration: underline;
            color: #ffc800;
        }
        
        /* message d'erreur */
        .error-message {
            color: #ff6b6b;
            font-size: 14px;
            margin-top: 5px;
            margin-left: 15px;
            display: none;
        }
        
        
        /* RESPONSIVE */
        @media (max-width: 768px) {
            .myform {
                padding: 30px 25px;
                max-width: 400px;
            }
            
            .myform h1 {
                font-size: 48px;
            }
            
            #mylogo {
                width: 140px;
                top: 15px;
                left: 15px;
            }
            
            #home {
                top: 15px;
                right: 15px;
            }
        }
        
        @media (max-width: 480px) {
            .myform {
                padding: 25px 20px;
                margin: 15px;
            }
            
            .myform h1 {
                font-size: 40px;
            }
            
            .inbox input {
                font-size: 14px;
                padding: 0 45px 0 15px;
            }
            
            .myform .btn {
                height: 45px;
                font-size: 18px;
            }
            
            #mylogo {
                width: 120px;
                top: 10px;
                left: 10px;
            }
            
            #home a {
                font-size: 28px;
            }
        }
        
        /* une petite animation  */
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        .myform {
            animation: fadeIn 0.5s ease-out;
        }
        
        .copyr {
            position: absolute;
            bottom: 5px;
            left: 0;
            right: 0;
            text-align: center;
            color: rgba(245, 196, 2, 0.541);
            font-size: 13px;
        }
    </style>
</head>
<body>
    <!-- Logo -->
    <a href="index.html"><img src="../mylogo.png" id="mylogo" alt="Cinema Camera Logo"></a>
    
    <!-- Home Button -->
    <div id="home">
        <a href="index.html" title="Retour à l'accueil">
            <i class="fas fa-home"></i>
        </a>
    </div>
    
    <!-- Login Form -->
    <div class="myform">
        <form id="loginForm" action="login.php" method="POST">
            <h1>Connexion</h1>
            <div class="inbox">
                <i class="bi bi-person-fill icon"></i>
                <input type="text" 
                       id="username" 
                       name="username" 
                       placeholder="@Email / Pseudo" 
                       required 
                       autocomplete="username">
                <div class="error-message" id="username-error"></div>
            </div>
            
            <div class="inbox">
                <i class="bi bi-key-fill"></i>
                <span class="password-toggle" id="togglePassword">
                    <i class="fas fa-eye"></i>
                </span>
                <input type="password" 
                       id="password" 
                       name="password" 
                       placeholder="Mot de passe" 
                       required 
                       autocomplete="current-password">
                <div class="error-message" id="password-error"></div>
            </div>
            <button type="submit" class="btn">
                <i class="fas fa-sign-in-alt"></i> Se connecter
            </button>
            <div class="inscription">
                <p>Vous n'avez pas de compte? <a href="inscription.html">Inscrivez-vous !</a></p>
            </div>
        </form>
    </div>
    

    <div class="copyr">
       <p> &copy; 1938-<script>document.write(new Date().getFullYear())</script> Cinema Camera. Tous droits réservés.</p>
    </div>
    
 <script src="../js/session.js"></script>
<script src="../js/connexion.js"></script>
</body>
</html>
