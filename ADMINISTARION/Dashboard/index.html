<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard</title>
    <link rel="stylesheet" href="styleDashB.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
    <!-- navbar -->
    <nav id="nav_bar">
        <div id="logo">
            <img src="../affiche/mylogo.png" alt="logo">
        </div>
        <article><i class="bi bi-house"></i><a href="../Dashboard/index.html">Dashboard</a></article>
        <article><i class="bi bi-ticket-detailed"></i><a href="../Reservation/reservation.html">Reservation</a></article>
        <article><i class="bi bi-film"></i><a href="../Gestion_Films/GestFilms.html">Films</a></article>
        <article><i class="bi bi-star-fill"></i><a href="../Avis/Avis.html">Avis</a></article>
        <article><i class="bi bi-person-circle"></i><a href="../myProfil/myProfil.html">My profil</a></article>
        <div class="Deconnexion">
            <a href="../../USER/web_project/web_project/html/index.html">Déconnexion</a>
        </div>
    </nav>

    <!-- main dashboard -->
    <main class="dashboardMain">
        <h1>Dashboard Analytics</h1>
        <div class="chartsContainer">
            <div class="chartCard">
                <h3>Réservations par Film</h3>
                <canvas id="pieChart"></canvas>
            </div>
            <div class="chartCard">
                <h3>Avis par Note</h3>
                <canvas id="donutChart"></canvas>
            </div>
            <div class="chartCard">
                <h3>Nombre de Réservations par Film</h3>
                <canvas id="barChart"></canvas>
            </div>
            <div class="chartCard">
                <h3>Évolution des Réservations</h3>
                <canvas id="lineChart"></canvas>
            </div>
            <div class="chartCard">
                <h3>Places vs Notes</h3>
                <canvas id="scatterChart"></canvas>
            </div>
        </div>
    </main>

    <script src="scriptDashb.js"></script>
</body>
</html>
