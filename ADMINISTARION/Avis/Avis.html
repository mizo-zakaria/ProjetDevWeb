<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestion Avis</title>
    <link rel="stylesheet" href="avisStyle.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
</head>
<body>
    <!-- navbar -->
    <nav id="nav_bar">
        <div id="logo">
            <img src="../affiche/mylogo.png" alt="logo">
        </div>
        <article>
            <i class="bi bi-house"></i>
            <a href="../Dashboard/index.html">Dashboard</a>
        </article>
        <article>
            <i class="bi bi-ticket-detailed"></i>
            <a href="../Reservation/reservation.html">Reservation</a>
        </article>
        <article>
            <i class="bi bi-film"></i>
            <a href="../Gestion_Films/GestFilms.html">Films</a>
        </article>
        <article>
            <i class="bi bi-star-fill"></i>
            <a href="../Avis/Avis.html">Avis</a>
        </article>
        <article>
            <i class="bi bi-person-circle"></i>
            <a href="../myProfil/myProfil.html">My profil</a>
        </article>
        <div class="Deconnexion">
            <a href="../../USER/web_project/web_project/html/index.html">Déconnexion</a>
        </div>
    </nav>

    <!-- partie gestion avis -->
    <main class="crudsGestAvis">
        <div class="head">
            <h2>Avis</h2>
            <p>Gestion de avis system</p>
        </div>

        <!-- inputs -->
        <div class="inputs">
            <div>
                <input placeholder="Nom client" type="text" id="clientName">
            </div>
            <div>
                <input placeholder="Email client" type="email" id="clientEmail">
            </div>
            <div class="input_classA">
                <select id="filmAvis">
                    <option value="">-- Choisir un film --</option>
                </select>
                <input placeholder="Note (1-5)" type="number" id="note" min="1" max="5">
            </div>
            <div>
                <input placeholder="Commentaire" type="text" id="commentaire">
            </div>
            <button type="submit" id="submit">CREATE</button>
            <div id="update"></div>
        </div>

        <!-- outputs -->
        <div class="outputs">
            <div class="searchOutput">
                <div>
                    <input onkeyup="filterData(this.value)" placeholder="SEARCH" type="text" id="search">
                </div>
                <div class="output_classA">
                    <button onclick="searchMood(this.id)" id="btnClient">Search by client</button>
                    <button onclick="searchMood(this.id)" id="btnFilm">Search by film</button>
                </div>
            </div>
            <div id="divDeleteAll"></div>
            <div>
                <table>
                    <thead>
                        <tr>
                            <th>id</th>
                            <th>Client</th>
                            <th>Email</th>
                            <th>Film</th>
                            <th>Note</th>
                            <th>Commentaire</th>
                            <th>update</th>
                            <th>delete</th>
                        </tr>
                    </thead>
                    <tbody id="tbodyAvis"></tbody>
                </table>
            </div>
        </div>
    </main>

    <script src="scriptAvis.js"></script>
</body>
</html>
